name: boutique-afi-whatsapp

services:
  - name: agent-vendeur-afi
    type: web
    regions:
      - fra
    build:
      type: buildpack
      build_command: pip install -r requirements.txt
      run_command: uvicorn numero_3.serveur:app --host 0.0.0.0 --port 8000
    ports:
      - port: 8000
        protocol: http
    routes:
      - path: /
        port: 8000
    instance_type: free
    scaling:
      min: 1
      max: 1
    health_checks:
      - path: /health
        port: 8000
        protocol: http
    env:
      - key: BASE_URL
        value: "https://api.rodiumai.io/v1"
      - key: GREEN_API_URL
        value: "https://api.green-api.com"
      - key: RODIUMAI_API_KEY
        value: ""
      - key: GREEN_API_ID_INSTANCE
        value: ""
      - key: GREEN_API_TOKEN_INSTANCE
        value: ""
      - key: WEBHOOK_SECRET_TOKEN
        value: "SESSION7.Pourl4b0utiqu3d3Af1bnin2026"
      - key: NUMERO_AFI_WHATSAPP
        value: "22899144584@c.us"
