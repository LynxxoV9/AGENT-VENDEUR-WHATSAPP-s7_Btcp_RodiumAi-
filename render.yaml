services:
  - type: web
    name: agent-vendeur-afi
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn numero_3.serveur:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: BASE_URL
        value: https://api.rodiumai.io/v1
      - key: GREEN_API_URL
        value: https://api.green-api.com
      - key: RODIUMAI_API_KEY
        sync: false
      - key: GREEN_API_ID_INSTANCE
        sync: false
      - key: GREEN_API_TOKEN_INSTANCE
        sync: false
      - key: WEBHOOK_SECRET_TOKEN
        sync: false
      - key: NUMERO_AFI_WHATSAPP
        sync: false
